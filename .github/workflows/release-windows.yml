name: Release Windows Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: querysql-v__VERSION__
          releaseName: "QuerySQL v__VERSION__"
          releaseBody: "Windows build of QuerySQL (x64, unsigned). Windows SmartScreen will warn on first run — click More info, then Run anyway."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
